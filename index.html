<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="start.html">
    <style>
        /* Reset & Base System Styles */
* {
    margin: 0;
    padding: 0;
    overflow: hidden;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none; 
}
body {
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

        .desktop {
            position: relative;
   background-size: cover; 
    background-position: center center; 
    background-repeat: no-repeat;  
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    filter: blur(0.5px);
    cursor: pointer;
    /* background-color: black; */
    /* background-image: url('/image/avatar.jpg.webp'); */
     image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
}
img{
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    filter: blur(0.5px);
    object-fit: cover;
}
.click{
    position: absolute;
    /* width: 800px; */
    bottom: 5rem;
    color: white;
    /* top: rem; */
    left: 46rem;
    letter-spacing: 0px;
    
    
    
    
}

video{
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    object-fit: cover;
    position: fixed;        
}
@media (min-width: 0px) and  (max-width: 480px) {
   
    .click{
        position: absolute;
          
    color: white;
    left: 0;
    /* width: 100%; */
    text-align: center;
    }
}

@media (min-width: 481px) and (max-width: 768px) {
     .click{
        position: absolute;
          bottom: 7rem;
    color: white;
   left: 11rem;
    /* width: 400px; */
    }
}
@media (min-width: 769px) and (max-width: 1279px) {
    .click{
        position: absolute;
          bottom: 7rem;
    color: white;
    left: 19rem;
    /* width: 400px; */
    }
  
}
 
</style>
</head>
<body class="">
    <div class="desktop">
        <a href="/start.html"> <video autoplay muted  src="/video/portfolio.mp4"></video></a>
 
    </div>
    <div class="click">
          <h2>CLICK ANYWHERE TO CONTINUE</h2>
    </div>
</body>
</html>
